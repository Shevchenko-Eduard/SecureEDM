name: ".NET build and test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
          # - macos-latest
        configuration:
          - Debug
          - Release
    runs-on: ${{ matrix.os }}
    env:
      Test_Solution_Path: Test/SecureEDM.Test.slnx
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Execute restore packages
        run: dotnet restore ${{ env.Test_Solution_Path }}

      - name: Execute build projects
        run: dotnet build ${{ env.Test_Solution_Path }} -c ${{ matrix.configuration }}

      - name: Execute unit tests
        run: dotnet test ${{ env.Test_Solution_Path }} -c ${{ matrix.configuration }} --no-build
